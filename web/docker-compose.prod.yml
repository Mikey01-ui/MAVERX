# Production stack for homelab — isolated from other projects.
# Postgres is NOT published to the host (port 5432 is already used by chosotrack).
services:
  postgres:
    image: postgres:16-alpine
    container_name: datagame-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: omni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: omni
    volumes:
      - datagame_pg_data:/var/lib/postgresql/data
    ports:
      # 5433 on host — chosotrack already uses 5432. Forward this port for Vercel → homelab DB.
      - "5433:5432"
    networks:
      - datagame
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni -d omni"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datagame-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - ${DATAGAME_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: postgresql://omni:${POSTGRES_PASSWORD}@postgres:5432/omni
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - datagame

networks:
  datagame:
    name: datagame-net

volumes:
  datagame_pg_data:
    name: datagame_pg_data
