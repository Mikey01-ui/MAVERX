# Builds the Next.js app from this repo (Mikey01-ui/MAVERX) and deploys
# to Azure Container Apps using GitHub Container Registry (no Azure ACR).
#
# Required GitHub secrets:
#   AZURE_CREDENTIALS   - output of: az ad sp create-for-rbac --sdk-auth
#   AUTH_SECRET         - openssl rand -base64 32
#   POSTGRES_PASSWORD   - alphanumeric password for Azure Database for PostgreSQL

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/mikey01-ui/maverx
  CONTAINER_APP_NAME: maverx-datagame
  RESOURCE_GROUP: maverx-rg
  CONTAINER_ENV: maverx-env
  AZURE_LOCATION: westeurope
  POSTGRES_SERVER: maverxpgmikey01ui
  POSTGRES_DB: omni
  POSTGRES_USER: omni

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAVERX
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Make GitHub package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH "/user/packages/container/maverx" -f visibility=public

  deploy-azure:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        id: check
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$AZURE_CREDENTIALS" ] || [ -z "$AUTH_SECRET" ] || [ -z "$POSTGRES_PASSWORD" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Azure secrets are not set yet. Image was pushed to ghcr.io/mikey01-ui/maverx; skipping Azure deploy."
            exit 0
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure
        if: steps.check.outputs.skip != 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App and Postgres
        if: steps.check.outputs.skip != 'true'
        uses: azure/cli@v2
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        with:
          inlineScript: |
            set -euo pipefail
            az group create --name "$RESOURCE_GROUP" --location "$AZURE_LOCATION"

            if ! az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$POSTGRES_SERVER" >/dev/null 2>&1; then
              az postgres flexible-server create \
                --resource-group "$RESOURCE_GROUP" \
                --name "$POSTGRES_SERVER" \
                --location "$AZURE_LOCATION" \
                --admin-user "$POSTGRES_USER" \
                --admin-password "$POSTGRES_PASSWORD" \
                --sku-name Standard_B1ms \
                --tier Burstable \
                --storage-size 32 \
                --version 16 \
                --public-access 0.0.0.0 \
                --yes
              az postgres flexible-server db create \
                --resource-group "$RESOURCE_GROUP" \
                --server-name "$POSTGRES_SERVER" \
                --database-name "$POSTGRES_DB"
            fi

            az postgres flexible-server firewall-rule create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$POSTGRES_SERVER" \
              --rule-name AllowAll \
              --start-ip-address 0.0.0.0 \
              --end-ip-address 255.255.255.255 \
              >/dev/null 2>&1 || true

            ENCODED_PASSWORD=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['POSTGRES_PASSWORD'], safe=''))")
            DATABASE_URL="postgresql://${POSTGRES_USER}:${ENCODED_PASSWORD}@${POSTGRES_SERVER}.postgres.database.azure.com:5432/${POSTGRES_DB}?sslmode=require"

            az containerapp up \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$CONTAINER_ENV" \
              --location "$AZURE_LOCATION" \
              --image "${IMAGE_NAME}:${GITHUB_SHA}" \
              --target-port 3000 \
              --ingress external \
              --registry-server ghcr.io

            FQDN=$(az containerapp show \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn \
              --output tsv)

            az containerapp secret set \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --secrets database-url="$DATABASE_URL" auth-secret="$AUTH_SECRET"

            az containerapp update \
              --name "$CONTAINER_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${IMAGE_NAME}:${GITHUB_SHA}" \
              --set-env-vars \
                "DATABASE_URL=secretref:database-url" \
                "AUTH_SECRET=secretref:auth-secret" \
                "AUTH_URL=https://${FQDN}" \
                "NODE_ENV=production"

            echo "Game URL: https://${FQDN}"
